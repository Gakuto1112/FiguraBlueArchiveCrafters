name: Test on push/pull-request

on:
  push:
    branches:
      - main
    paths:
      - src/**
      - scripts/**
      - .github/workflows/test.yml
      - .github/workflows/test_core.yml
  pull_request:
    branches:
      - main
    paths:
      - src/**
      - scripts/**
      - .github/workflows/test.yml
      - .github/workflows/test_core.yml

jobs:
  call-reusable:
    uses: ./.github/workflows/test_core.yml
    secrets: inherit
